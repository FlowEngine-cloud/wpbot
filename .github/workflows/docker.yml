name: Build & push Docker image

# Publishes ghcr.io/flowengine-cloud/wpbot:latest so FlowEngine's one-click deploy
# (https://flowengine.cloud/deploy/wpbot) has an image to pull.
# Uses the built-in GITHUB_TOKEN — no Docker Hub account or repo secrets needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/flowengine-cloud/wpbot:latest
