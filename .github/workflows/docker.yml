name: Build & push Docker image

# Publishes flowenginecloud/wpbot:latest so FlowEngine's one-click deploy
# (https://flowengine.cloud/deploy/wpbot) has an image to pull.
# Requires two repo secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: flowenginecloud/wpbot:latest
